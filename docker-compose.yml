version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: serabutin-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: serabutin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: serabutin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: serabutin-api
    ports:
      - "3000:3000"
    environment:
      APP_NAME: serabutin-id-backend
      PORT: 3000
      ENVIRONMENT: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/serabutin?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: change-me-in-production
      JWT_REFRESH_SECRET: change-me-refresh-in-production
      ACCESS_TOKEN_DURATION_MINUTES: 15
      REFRESH_TOKEN_DURATION_HOURS: 168
      BCRYPT_COST: 4
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./uploads
      STORAGE_LOCAL_URL: ${STORAGE_LOCAL_URL:-http://localhost:3000/uploads}
      # Prepayment: local development simulates the DOKU checkout so the
      # whole flow is testable without credentials. Use sandbox/production
      # with real credentials outside development.
      DOKU_MODE: ${DOKU_MODE:-mock}
      DOKU_CLIENT_ID: ${DOKU_CLIENT_ID:-}
      DOKU_SECRET_KEY: ${DOKU_SECRET_KEY:-}
      DOKU_BASE_URL: ${DOKU_BASE_URL:-https://api-sandbox.doku.com}
      DOKU_HUB_ACCOUNT_ID: ${DOKU_HUB_ACCOUNT_ID:-}
      DOKU_PAYMENT_METHODS: ${DOKU_PAYMENT_METHODS:-qris}
      PAYMENT_EXPIRY_MINUTES: ${PAYMENT_EXPIRY_MINUTES:-60}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      PAYOUT_ENCRYPTION_KEY: ${PAYOUT_ENCRYPTION_KEY:?set PAYOUT_ENCRYPTION_KEY (openssl rand -base64 32)}
      PAYOUT_ENCRYPTION_KEY_ID: ${PAYOUT_ENCRYPTION_KEY_ID:-v1}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
