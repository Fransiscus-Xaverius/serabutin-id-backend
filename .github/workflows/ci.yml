name: Backend CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -p 1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  build-and-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=development" >> $GITHUB_OUTPUT
          fi

      - name: Build & push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/serabutin-backend
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build --build-arg COMMIT_HASH=$SHORT_SHA -t $IMAGE:${{ steps.meta.outputs.tag }} .
          docker build --build-arg COMMIT_HASH=$SHORT_SHA -t $IMAGE:$SHORT_SHA .
          docker push $IMAGE --all-tags
